name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_sqlite, sqlite3, pdo_mysql, xml
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check standalone installer syntax
        run: php -l public/index.php && php -l public/installer/index.php
      - name: Lint tracked PHP source files
        run: git ls-files -z '*.php' | xargs -0 -r -n 1 php -l
      - name: Run Laravel tests
        run: php artisan test --compact
      - name: Compile all Blade templates
        run: php artisan view:cache
      - name: Verify route registration
        run: php artisan route:list --json > /tmp/moramarket-routes.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Check shared JavaScript syntax
        run: node --check resources/js/app.js
      - name: Build Tailwind assets
        run: npm run build

  installer:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: CI_root_password_891
          MYSQL_DATABASE: moramarket_install_ci
          MYSQL_USER: moramarket_ci
          MYSQL_PASSWORD: CI_DB_Password_891
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_mysql, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare application package dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm install --ignore-scripts
          npm run build
      - name: Check standalone installer
        run: php -l public/installer/index.php && bash support/qa-installer.sh
