name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_sqlite, sqlite3, pdo_mysql, xml
          coverage: none
      - name: Validate read-only aaPanel environment audit
        run: |
          bash -n support/aapanel-readonly-audit.sh
          bash support/aapanel-readonly-audit.sh --help
          BEFORE="$(git status --porcelain --untracked-files=normal)"
          REPORT="$(bash support/aapanel-readonly-audit.sh --ci)"
          printf '%s\n' "$REPORT"
          grep -qx 'MORAMARKET_AUDIT_MODE=READ_ONLY' <<< "$REPORT"
          grep -qx 'DATABASE=NOT_CONNECTED' <<< "$REPORT"
          grep -qx 'SERVER_CONFIG=NOT_MODIFIED' <<< "$REPORT"
          grep -qx 'RELEASE_READY=NO' <<< "$REPORT"
          test "$BEFORE" = "$(git status --porcelain --untracked-files=normal)"
      - name: Audit Composer 2 version banner compatibility
        run: |
          # Both formats occur in real Composer 2 releases.
          banner_pattern='^Composer[[:space:]](version[[:space:]])?2\.[0-9]+\.[0-9]+([[:space:]]|$)'
          [[ 'Composer 2.2.6 2022-02-04 17:00:38' =~ $banner_pattern ]]
          [[ 'Composer version 2.9.2 2026-01-01 00:00:00' =~ $banner_pattern ]]
          ! [[ 'Composer version 1.10.30' =~ $banner_pattern ]]
      - name: Require committed, validated dependency locks
        run: |
          test -s composer.lock
          test -s package-lock.json
          composer validate --no-check-publish
      - name: Install Composer exclusively from lock
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check standalone installer syntax
        run: php -l public/index.php && php -l public/installer/index.php
      - name: Validate isolated aaPanel synchronization helper
        run: bash -n support/aapanel-sync.sh && bash support/aapanel-sync.sh --help
      - name: Lint tracked PHP source files
        run: git ls-files -z '*.php' | xargs -0 -r -n 1 php -l
      - name: Run Laravel tests
        run: php artisan test --compact
      - name: Compile all Blade templates
        run: php artisan view:cache
      - name: Verify route registration
        run: php artisan route:list --json > /tmp/moramarket-routes.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check shared JavaScript syntax
        run: node --check resources/js/app.js
      - name: Build Tailwind assets
        run: |
          npm run build
          git diff --exit-code -- composer.lock package-lock.json

  compatibility-php83:
    name: PHP 8.3 Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_sqlite, sqlite3, pdo_mysql, xml, intl, zip
          coverage: none
      - name: Verify locked dependency compatibility and PHP 8.3 platform
        run: |
          test -s composer.lock
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
      - name: Run complete Laravel tests and compile templates
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
          php artisan view:cache
          php artisan route:list --json >/tmp/moramarket-php83-routes.json
          git diff --exit-code -- composer.lock

  compatibility-php85:
    name: PHP 8.5 Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_sqlite, sqlite3, pdo_mysql, xml, intl, zip
          coverage: none
      - name: Install locked Composer dependencies
        run: |
          test -s composer.lock
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
      - name: Set up test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify Laravel compatibility on PHP 8.5
        run: |
          php artisan test --compact
          php artisan view:cache
          php artisan route:list --json > /tmp/moramarket-php85-routes.json

  installer:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: CI_root_password_891
          MYSQL_DATABASE: moramarket_install_ci
          MYSQL_USER: moramarket_ci
          MYSQL_PASSWORD: CI_DB_Password_891
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_mysql, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare application package dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Check standalone installer
        run: php -l public/installer/index.php && bash support/qa-installer.sh


  qa-candidate-package:
    name: Self-contained QA ZIP and independent MySQL installer
    needs: [test, compatibility-php83, compatibility-php85, installer]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: CI_root_password_891
          MYSQL_DATABASE: moramarket_install_ci
          MYSQL_USER: moramarket_ci
          MYSQL_PASSWORD: CI_DB_Password_891
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3 for buyer-minimum runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, ctype, curl, fileinfo, gd, pdo_mysql, xml, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile locked production dependencies and assets
        run: |
          set -Eeuo pipefail
          test -s composer.lock && test -s package-lock.json
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          composer check-platform-reqs --no-dev
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- composer.lock package-lock.json
      - name: Verify packaging tools and build isolated ZIP
        run: |
          set -Eeuo pipefail
          bash -n support/build-qa-package.sh
          bash -n support/qa-candidate-package.sh
          OUT="$RUNNER_TEMP/moramarket-qa-$GITHUB_SHA.zip"
          bash support/build-qa-package.sh "$OUT"
          echo "MORAMARKET_QA_ARCHIVE=$OUT" >> "$GITHUB_ENV"
      - name: Verify extracted package and new installation
        run: |
          set -Eeuo pipefail
          bash support/qa-candidate-package.sh "$MORAMARKET_QA_ARCHIVE"
          sha256sum "$MORAMARKET_QA_ARCHIVE" > "$MORAMARKET_QA_ARCHIVE.sha256"
      - name: Retain nonproduction QA candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: moramarket-QA-NOT-FOR-PRODUCTION
          path: |
            ${{ runner.temp }}/moramarket-qa-*.zip
            ${{ runner.temp }}/moramarket-qa-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
